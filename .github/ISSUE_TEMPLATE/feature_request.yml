name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Issues in **English or French** are welcome (les tickets en français sont les bienvenus).

        RuneForge Studio is first a **reliable smart script editor** (files are never changed silently, rAthena and Hercules differences are respected, everything works offline). Requests that start from a concrete scripting problem are the easiest to act on. Please check the [roadmap](https://github.com/vazan/runeforge-npc-editor/blob/HEAD/docs/ROADMAP.md) and the [known limitations](https://github.com/vazan/runeforge-npc-editor/blob/HEAD/docs/KNOWN_LIMITATIONS.md): some features are planned for later versions, or deliberately out of scope.

        **Never paste secrets** (API keys, tokens, SSH keys, passwords).

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The scripting task or problem, and why it is hard today. Describe the need before the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How it could work. A rough sketch or an example script is enough.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or other ideas you considered.
    validations:
      required: false

  - type: dropdown
    id: persona
    attributes:
      label: Which best describes you?
      options:
        - New to NPC scripting
        - Experienced scripter
        - Server administrator
        - Part of a development team
        - Advanced content creator (quests / instances / systems)
    validations:
      required: false

  - type: dropdown
    id: emulator
    attributes:
      label: Emulator
      options:
        - rAthena
        - Hercules
        - Both
        - Not emulator specific
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor (Monaco) / tabs / themes
        - Opening / saving / recovery
        - Parser and diagnostics
        - Completion / hover / signature help
        - Project index / navigation / refactoring
        - Server databases (items / monsters / maps / constants)
        - NPC wizards and templates
        - Visual editor and node builder
        - Dialogue simulation
        - AI assistant
        - Git / deployment / remote servers (SSH/SFTP)
        - Installation / updates / packaging (Windows and Linux)
        - Accessibility or translation
        - Other
    validations:
      required: false

  - type: input
    id: requirement
    attributes:
      label: Related requirement ID (optional)
      description: "If your request extends an existing requirement listed in `docs/STATUS.md`, for example `RF-012`."
      placeholder: RF-012
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues, the roadmap and the known limitations.
          required: true
        - label: My request does not include secrets or private data.
          required: true
