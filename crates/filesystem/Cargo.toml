[package]
name = "runeforge-filesystem"
version = "0.0.0"
description = "Services de fichiers surs de RuneForge Studio : racines approuvees, chemins valides, ecriture atomique, recuperation."
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
dunce = "1.0.5"
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
